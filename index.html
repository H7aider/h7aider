<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Impact Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AI Impact Simulation</h1>
    </header>

    <section id="user_input">
        <label for="job_selection">Select a Job Category:</label>
        <select id="job_selection">
            <!-- Options will be populated here by JavaScript -->
        </select>
        <button id="run_button">Run Simulation</button>
    </section>

    <section id="simulation_results">
        <div id="simulation_output">
            <!-- Simulation results will be displayed here -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
